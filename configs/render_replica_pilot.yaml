# Phase 1 pilot: render one scene end to end and inspect the QC sheets.
# Entrypoint: python -m lot.render_replica --config configs/render_replica_pilot.yaml
replica_root: data/replica
output_root: data/replica_renders
scenes: [room_0]
seed: 0
image_height: 518
image_width: 518
hfov_deg: 90.0
eye_height_m: 1.5
viewpoints_per_scene: 6
# In-place rotation: fixed position, fixed angular steps.
yaw_offsets_deg: [-30.0, -22.5, -15.0, -7.5, 0.0, 7.5, 15.0, 22.5, 30.0]
pitch_offsets_deg: [-15.0, -7.5, 7.5, 15.0]
# Translation baselines are parallax_value * median scene depth at the viewpoint.
parallax_values: [0.05, 0.1, 0.2, 0.4]
# Orbit around the scene anchor at two radii.
orbit_radius_scales: [0.6, 1.0]
orbit_azimuth_offsets_deg: [-20.0, -15.0, -10.0, -5.0, 0.0, 5.0, 10.0, 15.0, 20.0]
qc_frames_per_regime: 12
