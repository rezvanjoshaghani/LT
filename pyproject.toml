[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lot"
version = "0.1.0"
description = "Learn or Transport? Dissecting cross-view prediction in frozen visual representations."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "pyyaml",
    "pillow",
    "matplotlib",
    # Pinned below 17: later releases ship only manylinux_2_28 wheels, and the
    # cluster is CentOS 7 with glibc 2.17.
    "pyarrow<17",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
