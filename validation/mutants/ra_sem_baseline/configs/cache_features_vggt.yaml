# Phase 2 batch: cache VGGT features and its estimated depth for all 18 scenes.
# The depth export is what Phase 4 needs. It is in VGGT's own scale, not meters;
# Phase 4 aligns it and reports how.
# Submit on the cluster:
#   sbatch --account "$SLURM_ACCOUNT" --partition "$SLURM_PARTITION" \
#          --array 0-17 scripts/cache_features.sbatch configs/cache_features_vggt.yaml
renders_root: data/replica_renders
cache_root: cache/features
scenes:
  - apartment_0
  - apartment_1
  - apartment_2
  - frl_apartment_0
  - frl_apartment_1
  - frl_apartment_2
  - frl_apartment_3
  - frl_apartment_4
  - frl_apartment_5
  - hotel_0
  - office_0
  - office_1
  - office_2
  - office_3
  - office_4
  - room_0
  - room_1
  - room_2
encoder: vggt_1b
batch_size: 2
device: cuda
export_depth: true
